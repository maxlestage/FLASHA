# Tests every push: the website (Rust, Paquets) and the iOS app (Swift). When
# everything is green, the branch is merged into master automatically (branches
# named wip/... are not), then master is deployed to Heroku by heroku.yml.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  site:
    name: Site (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Islands and 2D scene (WebAssembly)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - name: Browser bundle
        run: cargo build --lib --target wasm32-unknown-unknown --profile wasm-release

  ios:
    name: iOS app (Swift)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -project Flasha.xcodeproj \
            -scheme Flasha \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  merge:
    name: Merge into master
    needs: [site, ios]
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Merge ${{ github.ref_name }}
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "$BRANCH is already in master."
            exit 0
          fi
          git merge --no-ff --no-edit "$SHA" -m "Merge branch '$BRANCH' into master (auto-merge)"
          git push origin HEAD:master
      # A push made by a workflow starts no other workflow: start the deployment.
      - name: Deploy master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heroku.yml --ref master --repo "$GITHUB_REPOSITORY"
