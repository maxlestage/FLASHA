# Ouvre l'application FLASHA dans un simulateur iPhone (sur un Mac de GitHub) et
# prend une capture de chaque écran. Les captures sont jointes à l'exécution
# (Actions → Captures iPhone → l'exécution → Artifacts → captures-iphone).
#
# Lancé quand l'app change, et à la main : Actions → Captures iPhone → Run workflow
# (l'application GitHub le permet aussi).

name: Captures iPhone

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Simulateur iPhone
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compiler pour le simulateur
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Flasha.xcodeproj \
            -scheme Flasha \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Ouvrir l'app et capturer chaque écran
        working-directory: ios
        run: |
          set -euo pipefail
          # Le dernier iPhone « Pro » disponible (sinon le dernier iPhone).
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, list_ in devices.items() if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")]
          pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
          print((pro or phones)[-1]["udid"])
          ')
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged \
            --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/Flasha.app
          xcrun simctl privacy "$udid" grant all app.flasha.ios || true

          mkdir -p captures
          shot() {
            local name=$1
            shift
            xcrun simctl terminate "$udid" app.flasha.ios 2>/dev/null || true
            xcrun simctl launch "$udid" app.flasha.ios "$@" > /dev/null
            sleep 8
            xcrun simctl io "$udid" screenshot "captures/$name.png"
            echo "capture $name"
          }
          shot 1-fil -flashaTab friends -flashaSection Planche
          shot 2-flashs -flashaTab friends -flashaSection Flashs
          shot 3-amis -flashaTab friends -flashaSection Amis
          shot 4-talka -flashaTab talka
          shot 5-clips -flashaTab discover
          shot 6-profil -flashaTab profile
          shot 7-camera -flashaTab camera
      - uses: actions/upload-artifact@v7
        with:
          name: captures-iphone
          path: ios/captures
          retention-days: 30
